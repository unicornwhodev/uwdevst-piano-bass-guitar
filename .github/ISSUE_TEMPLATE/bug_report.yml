name: Report a problem
description: A problem with Piano, Bass or Guitar.
title: "[Instrument] Brief description"
body:
  - type: dropdown
    id: instrument
    attributes:
      label: Instrument
      options:
        - Piano
        - Bass
        - Guitar
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "For example: 1.0.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and music software
      placeholder: "For example: Windows 11, Reaper, VST3"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Description and steps to reproduce
      description: Include the model, preset, expected result and observed result.
    validations:
      required: true
